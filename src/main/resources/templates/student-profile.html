<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - ExamPortal</title>

    	<link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            ExamPortal
        </div>

        <div class="nav-links">
            <a href="/student/dashboard">Dashboard</a>
            <a href="/student/exam">Take Exam</a>
            <a href="/student/results">Results</a>
            <a href="/student/logout">Logout</a>
        </div>

    </nav>


    <!-- Profile Section -->
    <section class="auth-container">

        <div class="auth-card" style="width: 500px;">

            <!-- Profile Icon -->
            <div style="
                text-align:center;
                font-size:60px;
                margin-bottom:10px;
            ">
                👤
            </div>


            <h2>My Profile</h2>

            <p class="subtitle">
                View your student account information.
            </p>


            <!-- Student Name -->
            <div class="form-group">

                <label>Student Name</label>

                <input type="text"
                       th:value="${student.student_name}"
                       readonly>

            </div>


            <!-- Username -->
            <div class="form-group">

                <label>Username</label>

                <input type="text"
                       th:value="${student.username}"
                       readonly>

            </div>


            <!-- Student ID -->
            <div class="form-group">

                <label>Student ID</label>

                <input type="text"
                       th:value="${student.student_id}"
                       readonly>

            </div>


            <!-- Buttons -->
            <div style="
                display:flex;
                gap:12px;
                justify-content:center;
                flex-wrap:wrap;
                margin-top:25px;
            ">

                <a href="/student/dashboard"
                   class="btn btn-primary">

                    Dashboard

                </a>


                <a href="/student/results"
                   class="btn btn-outline">

                    My Results

                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 ExamPortal | Online Examination System
        </p>

    </footer>

</body>

</html>
