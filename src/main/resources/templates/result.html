<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Result - ExamPortal</title>

    	<link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            ExamPortal
        </div>

        <div class="nav-links">
            <a href="/student/dashboard">Dashboard</a>
            <a href="/student/results">My Results</a>
            <a href="/student/profile">Profile</a>
            <a href="/student/logout">Logout</a>
        </div>

    </nav>


    <!-- Result Section -->
    <section class="auth-container">

        <div class="auth-card"
             style="text-align:center; width:500px;">

            <!-- Icon -->
            <div style="font-size:60px; margin-bottom:15px;">
                🎉
            </div>


            <!-- Heading -->
            <h2 style="font-size:32px;">
                Examination Completed!
            </h2>

            <p class="subtitle">
                Your examination has been submitted successfully.
            </p>


            <!-- Score -->
            <div style="
                background:#eef2ff;
                padding:25px;
                border-radius:15px;
                margin:25px 0;
            ">

                <p style="
                    color:#6b7280;
                    font-size:16px;
                    margin-bottom:8px;
                ">
                    Your Score
                </p>

                <h1 style="
                    color:#4f46e5;
                    font-size:48px;
                    margin:0;
                ">

                    <span th:text="${score}"></span>

                    /

                    <span th:text="${totalQuestions}"></span>

                </h1>

            </div>


            <!-- Message -->
            <p style="
                color:#374151;
                margin-bottom:25px;
            ">

                Your result has been saved successfully.

            </p>


            <!-- Buttons -->
            <div style="
                display:flex;
                gap:12px;
                justify-content:center;
                flex-wrap:wrap;
            ">

                <a href="/student/results"
                   class="btn btn-primary">

                    View My Results

                </a>


                <a href="/student/dashboard"
                   class="btn btn-outline">

                    Dashboard

                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 ExamPortal | Online Examination System
        </p>

    </footer>

</body>

</html>
