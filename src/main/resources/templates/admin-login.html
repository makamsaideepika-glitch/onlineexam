<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ExamPortal</title>

    	<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Online Examination
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/student/login">
            Student Login
        </a>

    </div>

</nav>


<!-- ADMIN LOGIN -->

<section class="auth-container">

    <div class="auth-card">

        <div style="
            text-align:center;
            font-size:50px;
            margin-bottom:10px;
        ">
            👨‍💼
        </div>

        <h2>
            Admin Login
        </h2>

        <p class="subtitle">
            Access the examination administration panel
        </p>


        <!-- ERROR MESSAGE -->

        <div th:if="${error}"
             style="
                background:#fee2e2;
                color:#b91c1c;
                padding:12px;
                border-radius:8px;
                margin-bottom:20px;
                text-align:center;
             "
             th:text="${error}">
        </div>


        <!-- LOGIN FORM -->

        <form action="/admin/login"
              method="post">

            <div class="form-group">

                <label>
                    Admin Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter admin username"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required>

            </div>


            <button
                type="submit"
                class="form-button">

                Login as Admin

            </button>

        </form>


        <p style="
            text-align:center;
            margin-top:25px;
            color:#6b7280;
        ">

            Are you a student?

            <a href="/student/login"
               style="
                  color:#4f46e5;
                  font-weight:600;
               ">

                Student Login

            </a>

        </p>


        <p style="
            text-align:center;
            margin-top:15px;
        ">

            <a href="/"
               style="
                  color:#6b7280;
               ">

                ← Back to Home

            </a>

        </p>

    </div>

</section>
</body>

</html>
