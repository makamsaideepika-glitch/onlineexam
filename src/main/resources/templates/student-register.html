```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration - ExamPortal</title>

    	<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        ExamPortal
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/student/login">
            Student Login
        </a>

        <a href="/admin/login">
            Admin Login
        </a>

    </div>

</nav>


<!-- REGISTRATION -->

<section class="auth-container">

    <div class="auth-card">

        <h2>Create Student Account</h2>

        <p class="subtitle">
            Register to access online examinations
        </p>


        <!-- Error Message -->

        <div th:if="${error}"
             style="
                background:#fee2e2;
                color:#b91c1c;
                padding:12px;
                border-radius:8px;
                margin-bottom:20px;
                text-align:center;
             "
             th:text="${error}">
        </div>


        <!-- REGISTRATION FORM -->

        <form action="/student/register"
              method="post">

            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="student_name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Create a username"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <button
                type="submit"
                class="form-button">

                Create Account

            </button>

        </form>


        <!-- LOGIN LINK -->

        <p style="
            text-align:center;
            margin-top:25px;
            color:#6b7280;
        ">

            Already have an account?

            <a href="/student/login"
               style="
                  color:#4f46e5;
                  font-weight:600;
               ">

                Login here

            </a>

        </p>


        <!-- HOME LINK -->

        <p style="
            text-align:center;
            margin-top:15px;
        ">

            <a href="/"
               style="
                  color:#6b7280;
               ">

                ← Back to Home

            </a>

        </p>

    </div>

</section>


<!-- FOOTER -->

<footer class="footer">

    <p>
        © 2026 Online Examination System
    </p>

    <p>
        Built using Java Spring Boot, HTML, CSS and MySQL
    </p>

</footer>

</body>

</html>
```
